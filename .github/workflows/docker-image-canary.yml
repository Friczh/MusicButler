name: Build and publish Docker image (canary)

# Builds ./Dockerfile and pushes it to GHCR as musicbutler-canary -- its
# own image identity, separate from musicbutler-stable (see
# docker-image-stable.yml), so the two never overwrite each other's tags.
# No separate registry account/secret needed, GHCR accepts the repo's own
# built-in GITHUB_TOKEN as long as this workflow is granted
# `packages: write` below.
#
# Triggers:
#   - push to main: rebuilds `:latest` (and a plain `:<short-sha>` tag,
#     no prefix) on every merge.
#   - a pushed tag like `v1.2.3`: also publishes `:1.2.3`, `:1.2`, `:1`.
#   - workflow_dispatch: manual "Run workflow" button, for a rebuild
#     without a new commit. Unlike the stable workflow, the SHA tag here
#     has no editable prefix input -- always a plain `:<short-sha>`.
#     Two inputs on the manual-run form:
#       - codename: a milestone nickname (Android-style: Oreo, Pie).
#         Only published as a tag if codename_toggle is checked; if it's
#         checked and this is left blank, the run fails fast with a clear
#         error instead of silently publishing nothing or a bad tag.
#       - codename_toggle: off (default) = no codename tag published.
#         On = an extra `:<codename>` tag is published alongside latest
#         and the SHA tag.
#   IMPORTANT for workflow_dispatch: run it with the branch selector set
#   to `main` -- `latest` and the SHA tag are both gated on
#   is_default_branch, which reflects the branch the run was dispatched
#   from.
on:
  workflow_dispatch:
    inputs:
      codename:
        description: 'Milestone codename (e.g. Oreo) -- required if "Enable codename tag" is checked'
        required: false
        type: string
        default: ''
      codename_toggle:
        description: 'Enable codename tag'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  # Lower-cased below via docker/metadata-action -- GHCR rejects any
  # uppercase in the image path, and `github.repository` preserves
  # whatever case the account/repo name actually has. "-canary" suffix
  # gives this its own image identity, distinct from musicbutler-stable.
  IMAGE_NAME: ${{ github.repository }}-canary

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate codename input
        if: ${{ inputs.codename_toggle && inputs.codename == '' }}
        run: |
          echo "::error::codename_toggle is checked but the codename box is empty. Fill in a codename or uncheck the toggle."
          exit 1

      # Derives tags/labels from the git ref -- e.g. a push to main
      # produces `latest` + a plain `<short-sha>` tag; a pushed tag
      # `v1.2.3` additionally produces `1.2.3`, `1.2`, `1`. Also
      # normalizes IMAGE_NAME to lowercase, which GHCR requires.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
            type=raw,value=${{ inputs.codename }},enable=${{ inputs.codename_toggle == true }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single-platform (linux/amd64) on purpose -- this is meant for
          # one specific x86_64 Debian host, not general distribution, not
          # a glibc-floor requirement (no prebuilt release binary in this
          # image anymore -- PO tokens are minted in-process via
          # bgutils-js/jsdom, see src/lib/potProvider.js). Add
          # linux/arm64 here (and switch to QEMU emulation or an
          # arm64 runner) only if that host ever changes.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
