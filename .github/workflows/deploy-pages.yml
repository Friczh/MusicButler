name: Deploy to GitHub Pages

on:
  push:
    branches: [web]        # deploys whenever this branch updates
  workflow_dispatch:        # lets you trigger a deploy manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout web branch
        uses: actions/checkout@v4
        with:
          ref: web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .            # site files live at the root of the web branch
          exclude: |
            .github/**
            render-geo-server.js
            README.md

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
